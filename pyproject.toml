[project]
name = "harness"
version = "0.1.0"
description = "POC: topic-aware memory management for a LangGraph agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.8,<2",
    "langgraph>=1.2.19,<2",
    "langchain-anthropic>=1.7.9,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
